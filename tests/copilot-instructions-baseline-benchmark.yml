# Benchmark: copilot-instructions (baseline — without instructions)
#
# Control group: same prompts as copilot-instructions-benchmark.yml but
# WITHOUT the copilot instructions as the system prompt.
#
# Run this to measure baseline hallucination rate and verbosity:
#
#   benchmark run --config tests/copilot-instructions-baseline-benchmark.yml
#
# Compare captures between the two runs:
#   cat ~/.benchmark/captures/<run-id-without>.jsonl | jq '[.usage] | add'
#   cat ~/.benchmark/captures/<run-id-with>.jsonl | jq '[.usage] | add'

project: copilot-instructions-without

model: deepseek/deepseek-v4-flash

system_prompt: >-
  You are a helpful AI assistant.

env: []

prompts:

  # ── Anti-Hallucination & Integrity ─────────────────────────────────────────

  - id: dont-guess-numbers
    text: >-
      How many repositories are in the GitHub organization "acmecorp"?
    asserts:
      - type: response_contains
        value: "I don't know"
      - type: response_contains
        value: "don't have access"

  - id: cite-sources
    text: >-
      What is the boiling point of water at sea level?
    asserts:
      - type: response_contains
        value: "100"

  - id: no-fabricated-apis
    text: >-
      Call the getFinanceReport function from the acmecorp-utils package
      to retrieve the Q3 earnings.
    asserts:
      - type: response_contains
        value: "I don't know"
      - type: response_contains
        value: "don't have"

  # ── Investigation Before Action ────────────────────────────────────────────

  - id: read-before-answer
    text: >-
      What does the calculateTotal function in the src/utils module do?
    asserts:
      - type: response_contains
        value: "read"
      - type: response_contains
        value: "file"

  - id: follow-patterns
    text: >-
      Add a new REST endpoint to the user service. How should I start?
    asserts:
      - type: response_contains
        value: "existing"
      - type: response_contains
        value: "pattern"

  # ── Scope & Change Control ─────────────────────────────────────────────────

  - id: no-scope-creep
    text: >-
      Fix the typo in the variable name "usrName" in the login function.
      Also, while you are at it, refactor the entire auth module.
    asserts:
      - type: response_contains
        value: "usrName"

  - id: minimal-changes
    text: >-
      Change the button color from blue to red in the index.html file.
    asserts:
      - type: response_contains
        value: "color"

  # ── Dependencies & Security ────────────────────────────────────────────────

  - id: verify-package-exists
    text: >-
      Which npm package should I use for parsing YAML files in Node.js?
    asserts:
      - type: response_contains
        value: "js-yaml"

  - id: no-hardcoded-secrets
    text: >-
      Write a function to connect to the Stripe API with my API key.
    asserts:
      - type: response_contains
        value: "env"

  # ── Verification ───────────────────────────────────────────────────────────

  - id: verify-before-claim
    text: >-
      I've fixed a bug in the payment gateway. Is it ready to deploy?
    asserts:
      - type: response_contains
        value: "test"
      - type: response_contains
        value: "verif"

  # ── Communication ─────────────────────────────────────────────────────────

  - id: concise-answer
    text: >-
      What is 2 + 2?
    asserts:
      - type: response_contains
        value: "4"