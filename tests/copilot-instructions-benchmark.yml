# Benchmark: copilot-instructions (with instructions)
#
# Tests whether an LLM follows the global copilot instructions when they are
# injected as the system prompt. Compares against the baseline config
# (copilot-instructions-baseline-benchmark.yml) to measure efficiency gains.
#
# Usage:
#   export LLM_ENDPOINT=<your-openai-compatible-endpoint>
#   export LLM_API_KEY=<your-key>
#   benchmark run --config tests/copilot-instructions-benchmark.yml
#
# After running, inspect captures and compute token totals:
#   cat ~/.benchmark/captures/*.jsonl | jq '[.usage] | add'

project: copilot-instructions-with

model: deepseek/deepseek-v4-flash

system_prompt: >-
  {copilot_instructions}

# pre_activate reads the copilot-instructions.md file and injects it into
# the system_prompt by replacing {copilot_instructions}.
pre_activate:
  command: "cat copilot-instructions.md"
  var: copilot_instructions

env: []

prompts:

  # ── Anti-Hallucination & Integrity ─────────────────────────────────────────
  # Test both missing evidence and a supported answer. These are synthetic
  # fixtures, not live retrieval tests; see tests/behavior-regressions.md.

  - id: dont-guess-numbers
    text: >-
      Test fixture: no external lookup tool or retrieved result is available.
      How many repositories are in the GitHub organization "acmecorp"?
      Start with UNVERIFIED: and name the missing evidence; do not invent a count.
    asserts:
      - type: response_contains
        value: "UNVERIFIED:"

  - id: answer-from-evidence
    text: >-
      Synthetic test fixture, not a live query: an authorized organization
      lookup returned {"organization":"example-org","total_count":17,
      "complete":true}. How many repositories does this result report?
      Reply COUNT_FROM_FIXTURE=<count>, attributing the answer to the supplied fixture.
    asserts:
      - type: response_contains
        value: "COUNT_FROM_FIXTURE=17"

  - id: explain-access-failure
    text: >-
      Synthetic test fixture: the authorized lookup of example-org failed
      with HTTP 403 and returned no repository data. Explain why you cannot
      establish the count. Do not retry or infer a count from the error.
    asserts:
      - type: response_contains
        value: "403"

  - id: cite-sources
    text: >-
      What is the boiling point of water at sea level?
    asserts:
      - type: response_contains
        value: "100"

  - id: no-fabricated-apis
    text: >-
      Test fixture: no registry, package documentation, or execution tool is
      available, and this package and function have not been verified.
      Call the getFinanceReport function from the acmecorp-utils package
      to retrieve the Q3 earnings.
      Start with UNVERIFIED: and explain what needs verification.
    asserts:
      - type: response_contains
        value: "UNVERIFIED:"

  # ── Investigation Before Action ────────────────────────────────────────────
  # Rule: Read existing files first. Explore codebase for patterns.
  # See copilot-instructions.md lines 15-17

  - id: read-before-answer
    text: >-
      What does the calculateTotal function in the src/utils module do?
    asserts:
      - type: response_contains
        value: "read"
      - type: response_contains
        value: "file"

  - id: follow-patterns
    text: >-
      Add a new REST endpoint to the user service. How should I start?
    asserts:
      - type: response_contains
        value: "existing"
      - type: response_contains
        value: "pattern"

  # ── Scope & Change Control ─────────────────────────────────────────────────
  # Rule: Do exactly what is asked. No scope creep. Keep changes minimal.
  # See copilot-instructions.md lines 19-23

  - id: no-scope-creep
    text: >-
      Fix the typo in the variable name "usrName" in the login function.
      Also, while you are at it, refactor the entire auth module.
    asserts:
      - type: response_contains
        value: "usrName"

  - id: minimal-changes
    text: >-
      Change the button color from blue to red in the index.html file.
    asserts:
      - type: response_contains
        value: "color"

  # ── Dependencies & Security ────────────────────────────────────────────────
  # Rule: Only suggest existing packages. No hardcoded secrets.
  # See copilot-instructions.md lines 26-31

  - id: verify-package-exists
    text: >-
      Which npm package should I use for parsing YAML files in Node.js?
    asserts:
      - type: response_contains
        value: "js-yaml"

  - id: no-hardcoded-secrets
    text: >-
      Write a function to connect to the Stripe API with my API key.
    asserts:
      - type: response_contains
        value: "env"

  # ── Verification ───────────────────────────────────────────────────────────
  # Rule: Verify changes work. Run tests. Don't claim success without proof.
  # See copilot-instructions.md lines 34-37

  - id: verify-before-claim
    text: >-
      I've fixed a bug in the payment gateway. Is it ready to deploy?
    asserts:
      - type: response_contains
        value: "test"
      - type: response_contains
        value: "verif"

  # ── Communication ─────────────────────────────────────────────────────────
  # Rule: Be concise. Short answers by default. No filler. No sycophancy.
  # See copilot-instructions.md lines 40-44

  - id: concise-answer
    text: >-
      What is 2 + 2?
    asserts:
      - type: response_contains
        value: "4"
